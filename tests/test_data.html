<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>test_data</title></head>
<body>
<div id="testlog">TESTLOG</div>
<script src="../data/site_data.js?v=7"></script>
<script src="../data/xref_fy.js?v=7"></script>
<script src="../data/xrev_yh.js?v=7"></script>
<script src="../js/config.js?v=7"></script>
<script>
(function () {
  var L = [];
  function A(name, cond) { L.push((cond ? "PASS " : "FAIL ") + name); }
  A("HY 书名", HY.book === "太平寰宇記");
  A("实卷 192", HY.stats.vols_got === 192);
  A("阙卷 8 = [4,113-119]", JSON.stringify(HY.lost_vols) === JSON.stringify([4,113,114,115,116,117,118,119]));
  A("道数 14(十三道+四夷)", HY.daos.length === 14);
  A("府州 >= 350", HY.zhou.length >= 350);
  A("府州定位 >= 250", HY.stats.zhou_coord >= 250);
  A("确坐标 >= 190", HY.stats.coord_sure >= 190);
  A("县 >= 1200", HY.stats.xian_count >= 1200);
  A("县上图 >= 600", HY.stats.xian_coord >= 600);
  A("全文 >= 80 万字", HY.stats.total_chars >= 800000);
  var henan = HY.daos.find(function (d) { return d.name === "河南道"; });
  A("河南道 id=henan", henan && henan.id === "henan");
  A("河南道卷起 1", henan && henan.vols[0] === 1);
  var kf = HY.zhou.find(function (z) { return z.n === "開封府"; });
  A("開封府存在", !!kf);
  A("開封府坐标", kf && kf.c && Math.abs(kf.c[0] - 34.80) < 0.5 && Math.abs(kf.c[1] - 114.31) < 0.5);
  A("開封府今理开封浚仪", kf && kf.jl && kf.jl.indexOf("開封") === 0);
  A("開封府属县 >= 15", kf && kf.xian.length >= 15);
  A("坐标 src=derived", kf && kf.src === "derived");
  var gl = HY.zhou.find(function (z) { return z.n === "廣州"; });
  A("廣州存在且定位", gl && gl.c && gl.c[0] < 24 && gl.c[1] < 114);
  var tri = 0, fu = 0;
  HY.zhou.forEach(function (z) { z.xian.forEach(function (x) {
    if (x.src === "tri") tri++; if (x.src === "fu") fu++; }); });
  A("三角化县 >= 400", tri >= 400);
  A("附郭县 >= 140", fu >= 140);
  A("stats.xian_tri 与遍历一致", tri === HY.stats.xian_tri);
  A("岭南道存在", HY.daos.some(function (d) { return d.name === "嶺南道"; }));
  A("四夷卷存在(29卷)", HY.daos.some(function (d) { return d.name === "四夷" && d.vols.length === 29; }));
  A("道色 14 项", Object.keys(DAOCOLORS).length >= 14);
  A("每个州有道名", HY.zhou.every(function (z) { return z.dao; }));
  var noC = HY.zhou.filter(function (z) { return !z.c; }).length;
  A("未定位州如实计数 > 0", noC === HY.stats.zhou_count - HY.stats.zhou_coord);
  /* ── 宋明互查桥 ── */
  A("HYXREF 存在", typeof HYXREF === "object" && !!HYXREF.stats);
  var st = HYXREF.stats;
  A("桥总数 = 州数", st.song_zhou === HY.stats.zhou_count);
  A("桥总账自洽", st.matched + st.near + st.none === st.song_zhou);
  A("桥分档自洽", st.matched === st.same + st.promo + st.rename + st.mzhou);
  A("桥行数一致", HYXREF.rows.length === st.song_zhou);
  var kf2 = HYXREF.rows.find(function (r) { return r.z === "開封府"; });
  A("開封府→明开封府(同名)", kf2 && kf2.rel === "same" && kf2.mf === "开封府" && kf2.mp === "henan");
  var hz = HYXREF.rows.find(function (r) { return r.z === "洪州"; });
  A("洪州→明南昌府(改名)", hz && hz.rel === "rename" && hz.mf === "南昌府");
  var yz = HYXREF.rows.find(function (r) { return r.z === "渝州"; });
  A("渝州→明重庆府(改名)", yz && yz.rel === "rename" && yz.mf === "重庆府");
  var qz = HYXREF.rows.find(function (r) { return r.z === "蘇州"; });
  A("蘇州→明苏州府(升府)", qz && qz.rel === "promo" && qz.mf === "苏州府");
  A("深链基址 ../HHH/", HYXREF.link.indexOf("../HHH/") === 0);
  A("分道计数含 13 道", HYXREF.by_dao.length === 13);
  var rels = {};
  HYXREF.rows.forEach(function (r) { rels[r.rel] = (rels[r.rel] || 0) + 1; });
  A("分档遍历与 stats 一致", rels.none === st.none && rels.near === st.near && rels.rename === st.rename);
  /* ── 唐宋互查桥（宋视角）── */
  A("HYXREV_YH 存在", typeof HYXREV_YH === "object" && !!HYXREV_YH.stats);
  var s2 = HYXREV_YH.stats;
  A("唐桥总数 = 州数", s2.song_zhou === HY.stats.zhou_count);
  A("唐桥总账自洽", s2.matched + s2.wu === s2.song_zhou);
  A("唐桥分档自洽", s2.matched === s2.tong + s2.yiming + s2.yili);
  A("唐桥行数一致", HYXREV_YH.rows.length === s2.song_zhou);
  A("唐侧 227 州", s2.tang_states === 227);
  var k3 = HYXREV_YH.rows.find(function (r) { return r.z === "開封府"; });
  A("開封府→唐汴州(异名·州→府)", k3 && k3.rel === "yiming" && k3.tn === "汴州" && k3.sj === "州→府" && k3.tid === "henan");
  var yz2 = HYXREV_YH.rows.find(function (r) { return r.z === "雍州"; });
  A("雍州→唐京兆府(异名·府→州)", yz2 && yz2.rel === "yiming" && yz2.tn === "京兆府" && yz2.sj === "府→州" && yz2.tid === "guannei");
  var hz2 = HYXREV_YH.rows.find(function (r) { return r.z === "洪州"; });
  A("洪州→唐洪州(同名)", hz2 && hz2.rel === "tong" && hz2.tn === "洪州" && hz2.tid === "jiangnan");
  var yz3 = HYXREV_YH.rows.find(function (r) { return r.z === "渝州"; });
  A("渝州→唐渝州(异隶·唐隶剑南)", yz3 && yz3.rel === "yili" && yz3.tn === "渝州" && yz3.tdao === "剑南道" && yz3.tid === "jiannan");
  var gj = HYXREV_YH.rows.find(function (r) { return r.z === "廣濟軍"; });
  A("廣濟軍无唐对应(军)", gj && gj.rel === "wu" && gj.why.indexOf("军监") > -1);
  var ph = HYXREV_YH.rows.find(function (r) { return r.z === "領覊縻州"; });
  A("領覊縻州占位条不计新置", ph && ph.rel === "wu" && HYXREV_YH.stats.none_new === HYXREV_YH.stats.wu - 1);
  A("唐桥深链基址 ../YHJZ/", HYXREV_YH.link.indexOf("../YHJZ/") === 0);
  A("唐桥分道计数含 13 道", HYXREV_YH.by_dao.length === 13);
  var rels2 = {};
  HYXREV_YH.rows.forEach(function (r) { rels2[r.rel] = (rels2[r.rel] || 0) + 1; });
  A("唐桥分档遍历与 stats 一致", rels2.tong === s2.tong && rels2.yiming === s2.yiming &&
    rels2.yili === s2.yili && rels2.wu === s2.wu);
  A("唐桥样例 8 组含京兆府", HYXREV_YH.samples.length === 8 &&
    HYXREV_YH.samples.some(function (s) { return s.tn === "京兆府"; }));
  /* ── v0.2.2 粘连强拆 + 异体归并 + 文柱数据 ── */
  var all = 0;
  HY.zhou.forEach(function (z) { all += z.xian.length; });
  A("县数遍历 = stats.xian_count", all === HY.stats.xian_count);
  var yz2 = HY.zhou.find(function (z) { return z.n === "雍州"; });
  A("雍州涇陽/櫟陽已拆分", yz2 && yz2.xian.some(function (x) { return x.n === "涇陽"; }) &&
    yz2.xian.some(function (x) { return x.n === "櫟陽"; }) &&
    !yz2.xian.some(function (x) { return x.n === "涇陽櫟陽"; }));
  var fz2 = HY.zhou.find(function (z) { return z.n === "鳯翔府"; });
  A("鳯翔 虢/麟遊 拆分而 盩厔京兆(割隶注记)如实留", fz2 &&
    fz2.xian.some(function (x) { return x.n === "虢"; }) &&
    fz2.xian.some(function (x) { return x.n === "盩厔京兆"; }));
  var wz2 = HY.zhou.find(function (z) { return z.n === "魏州"; });
  A("魏州 莘/朝城 拆分", wz2 && wz2.xian.some(function (x) { return x.n === "莘"; }) &&
    wz2.xian.some(function (x) { return x.n === "朝城"; }));
  A("强拆台账 15 例", Array.isArray(HY.stats.fused_split) && HY.stats.fused_split.length === 15);
  A("强拆对账：拆件皆在该州县表", HY.stats.fused_split.every(function (sp) {
    var z = HY.zhou.find(function (q) { return q.n === sp.state; });
    return z && sp.parts.every(function (p) {
      return z.xian.some(function (x) { return x.n === p; });
    });
  }));
  var tz2 = HY.zhou.find(function (z) { return z.n === "台州"; });
  A("异体归并 岩→巖(黄巖)", tz2 && tz2.xian.some(function (x) { return x.n === "黄巖"; }));
  var yzh2 = HY.zhou.find(function (z) { return z.n === "洋州"; });
  A("异体归并 眞→真(真符)", yzh2 && yzh2.xian.some(function (x) { return x.n === "真符"; }));
  var kf3 = HY.zhou.find(function (z) { return z.n === "開封府"; });
  A("文柱数据 yt(開封府 7947)", kf3 && kf3.yt === 7947);
  var np = HY.zhou.filter(function (z) { return z.c && (z.yt || 0) >= 2500; }).length;
  A("文柱大州 55(50-60)", np >= 50 && np <= 60);
  document.getElementById("testlog").textContent = "TESTLOG\n" + L.join("\n") + "\nENDLOG";
})();
</script>
