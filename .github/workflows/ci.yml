# 寰宇经纬 · push/PR 门禁（承方舆经纬 ci.yml 结构）
# run_tests.py 是 VT+CDP 双协议，不挑浏览器内核：探测顺序 HY_BROWSER → Edge → Chrome
#（run_tests.py CANDS，env 优先即 Linux 便携），CI 注入 HY_BROWSER=/usr/bin/google-chrome。
#
# 协议取舍（显式注明，承 audit.yml 风格——不静默跳过任何页）：
#   · test_data / test_map —— VT（--virtual-time-budget + dump-dom）。这两页本就按虚时
#     协议写（同步断言），虚时不推 promise/Worker 的坑与它们无关；
#   · test_reader / test_search —— CDP 真实时间（虚时不推 promise/Worker，本站已证）。
#     CDP 是 Chromium 通用协议，ubuntu 的 google-chrome 与 Edge 同源——HHH audit 在
#     runner 上同款 /json/new PUT + websocket 通道已连跑多轮为证；
#   · 故 CI 不排除任何断言页，四页全量入闸；若 ubuntu Chrome 的 VT 他日生变，
#     失败即红（绝不 || true 兜底，教训 20），届时在 run_tests 协议分流处改道。
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 浏览器存在性检验
        run: |
          # 2026-11-17 教训（承 HHH ci.yml）：ubuntu 镜像迁移期 chromium-browser 是 snap
          # 过渡壳，容器内不可用且 || true 吞错把「确定坏」变「随机坏」——
          # CI 一律用 runner 预装 Chrome，缺件即红，绝不兜底
          test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - name: 起本地服务
        run: |
          python -m http.server 9700 --bind 127.0.0.1 &
          sleep 2
          curl -sf http://127.0.0.1:9700/index.html -o /dev/null && echo server-up
      - name: 无头回归 run_tests.py（lint + 数据断言 + 账目 + VT×2 + CDP×2）
        env:
          HY_BROWSER: /usr/bin/google-chrome
          HY_BASE: http://127.0.0.1:9700/
        run: python run_tests.py
