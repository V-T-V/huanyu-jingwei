<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寰宇经纬 · 三维形胜</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css?v=6">
<style>
:root { --paper:#efe6cf; --ink:#2b2416; --red:#b23a2e; --teal:#2f5d70; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; font-family:"KaiTi","STKaiti",serif; }
#map3d { position:absolute; inset:0; }
#hud { position:absolute; top:14px; left:16px; z-index:10; background:rgba(239,230,207,.9);
  border:1px solid rgba(90,72,44,.3); border-radius:10px; padding:10px 16px; max-width:330px; }
#hud h1 { font-size:19px; letter-spacing:3px; color:var(--ink); font-weight:normal; }
#hud p { font-size:12px; color:#5a4c34; margin-top:5px; font-family:"Microsoft YaHei",sans-serif; line-height:1.6; }
#views { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:10;
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
#views button { padding:6px 14px; border-radius:16px; border:1px solid rgba(90,72,44,.4);
  background:rgba(239,230,207,.92); color:var(--ink); font-family:inherit; font-size:13px; cursor:pointer; }
#views button:hover { border-color:var(--teal); color:var(--teal); }
#views button.on { background:var(--teal); color:#f6efdc; }
#card { position:absolute; right:16px; top:14px; z-index:10; width:250px;
  background:rgba(239,230,207,.93); border:1px solid rgba(90,72,44,.3); border-radius:10px;
  padding:13px 15px; display:none; }
#card h3 { font-size:18px; color:var(--red); font-weight:normal; }
#card .m { font-size:11px; color:#5a4c34; font-family:"Microsoft YaHei",sans-serif; margin-top:3px; }
#card .x { font-size:11px; color:#5a4c34; margin-top:6px; line-height:1.6; max-height:180px; overflow:auto; }
#hint { position:absolute; bottom:64px; left:50%; transform:translateX(-50%); z-index:9;
  font-size:11px; color:#5a4c34; font-family:"Microsoft YaHei",sans-serif; opacity:.8; }
a.back { position:absolute; top:14px; right:280px; z-index:11; color:var(--teal); font-size:13px;
  text-decoration:none; background:rgba(239,230,207,.9); padding:5px 12px; border-radius:14px;
  border:1px solid rgba(90,72,44,.3); }
#card .go2d { display:inline-block; margin-top:8px; color:var(--red); font-size:12px; letter-spacing:1px;
  text-decoration:none; border:1px solid rgba(178,58,46,.45); border-radius:12px; padding:3px 10px;
  background:rgba(245,238,218,.9); }
#card .go2d:hover { background:var(--red); color:#f6efdc; }
</style>
</head>
<body>
<div id="map3d"></div>
<div id="hud">
  <h1>寰宇經緯 · 三維形勝</h1>
  <p>太平寰宇記 255 州治立于真山川（AWS 地形 · 夸张 1.35）。州点道色同 2D，<b>圆径随属县数</b>（0—30 县渐大）；<b>沿革文柱</b>立五十五大州（柱高随条目文量，学方舆 3D 被引文柱）。点击州名/文柱开卡；「▶ 飛覽」连飞六形胜。</p>
</div>
<a class="back" href="index.html">↩ 2D 輿圖</a>
<div id="card"><h3 id="cn"></h3><div class="m" id="cm"></div><div class="x" id="cx"></div></div>
<div id="hint">Ctrl+拖拽俯仰 · 右键旋转 · 滚轮缩放</div>
<div id="views"></div>

<script src="vendor/maplibre-gl.js?v=6"></script>
<script src="data/site_data.js?v=6"></script>
<script src="js/config.js?v=6"></script>
<script>
(function () {
  if (typeof maplibregl === "undefined") {
    document.body.innerHTML = "<p style='padding:40px'>MapLibre 加载失败（vendor/maplibre-gl.js）</p>";
    return;
  }
  var map = new maplibregl.Map({
    container: "map3d",
    style: {
      version: 8,
      glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
      sources: {
        sat: { type: "raster", tiles: [
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256, maxzoom: 16 },
        terrain: { type: "raster-dem", tiles: [
          "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
          encoding: "terrarium", tileSize: 256, maxzoom: 13 },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#dcd2b4" } },
        { id: "sat", type: "raster", source: "sat", paint: { "raster-opacity": .82,
          "raster-saturation": -0.35, "raster-brightness-max": 1.05 } },
      ],
    },
    center: [108.5, 34.5], zoom: 3.6, pitch: 52, bearing: -18,
    attributionControl: false, antialias: true,
    maxBounds: [[85, 15], [135, 47]],
  });
  map.on("error", function (e) { /* 高程/字体不可达则自动降级 */ });
  map.on("load", function () {
    map.addSource("hy", { type: "geojson", data: zhouGeo() });
    map.addLayer({
      id: "zhou-halo", type: "circle", source: "hy",
      paint: { "circle-radius": ["interpolate", ["linear"], ["get", "xct"], 0, 5, 10, 7, 30, 10],
        "circle-color": ["get", "color"],
        "circle-opacity": .28, "circle-stroke-width": 1, "circle-stroke-color": ["get", "color"] },
    });
    map.addLayer({
      id: "zhou-dot", type: "circle", source: "hy",
      paint: { "circle-radius": ["interpolate", ["linear"], ["get", "xct"], 0, 2.6, 10, 3.4, 30, 4.6],
        "circle-color": ["get", "color"],
        "circle-stroke-width": 1, "circle-stroke-color": "#f6efdc" },
    });
    /* 沿革文柱（学方舆经纬 3D 被引文柱）：条目文量 yt≥2500 字的大州立柱
       （沿革段+叙事尾段字数，build_data.py 出），log 文量 → 柱高 0.5–8 km（示意尺度），
       金→朱随高；点击开柱卡（沿革句节引）并可入 2D 州卡 */
    map.addSource("pillars", { type: "geojson", data: pillarGeo() });
    map.addLayer({
      id: "yz-pillar", type: "fill-extrusion", source: "pillars",
      paint: {
        "fill-extrusion-height": ["get", "h"],
        "fill-extrusion-base": 0,
        "fill-extrusion-opacity": .55,
        "fill-extrusion-color": ["interpolate", ["linear"], ["get", "h"],
          500, "#d9a05a", 4000, "#c0603a", 8000, "#8f1f14"],
      },
    }, "zhou-halo");
    try { map.setTerrain({ source: "terrain", exaggeration: 1.35 }); } catch (e) {}
    map.on("click", ["zhou-dot", "zhou-halo"], function (e) {
      var z = e.features[0].properties;
      var card = document.getElementById("card");
      document.getElementById("cn").textContent = z.n;
      document.getElementById("cm").textContent = z.dao + " · 今" + (z.now || "?") + " · 卷" + z.vols;
      document.getElementById("cx").textContent = (z.yz || "").slice(0, 130) + "……";
      card.style.display = "block";
      map.flyTo({ center: [e.lngLat.lng, e.lngLat.lat], zoom: Math.max(map.getZoom(), 6.4), duration: 1.2 });
    });
    map.on("click", "yz-pillar", function (e) {
      openPillar(e.features[0].properties);
    });
    ["yz-pillar"].forEach(function (lid) {
      map.on("mouseenter", lid, function () { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", lid, function () { map.getCanvas().style.cursor = ""; });
    });
  });

  var YT_MIN = 2500;   /* 文柱门槛：条目文量字数（55 大州，数据实测） */
  function ring(lng, lat, r) {
    var pts = [];
    for (var i = 0; i <= 6; i++) {
      var a = Math.PI * 2 * i / 6;
      pts.push([lng + r * Math.cos(a), lat + r * Math.sin(a) * .82]);
    }
    return [[pts]];
  }
  function pillarGeo() {
    var zs = HY.zhou.filter(function (z) { return z.c && (z.yt || 0) >= YT_MIN; });
    var lo = Math.log(YT_MIN);
    var hi = Math.log(Math.max.apply(null, zs.map(function (z) { return z.yt; })));
    return { type: "FeatureCollection", features: zs.map(function (z) {
      var h = Math.round(500 + 7500 * (hi > lo ? (Math.log(z.yt) - lo) / (hi - lo) : .5));
      return { type: "Feature",
        geometry: { type: "Polygon", coordinates: ring(z.c[1], z.c[0], .055) },
        properties: { n: z.n, dao: z.dao, now: z.now || "", vols: String(z.vols[0]),
          yz: z.yz || "", yt: z.yt, h: h, lng: z.c[1], lat: z.c[0] } };
    }) };
  }

  function zhouGeo() {
    var feats = HY.zhou.filter(function (z) { return z.c; }).map(function (z) {
      return { type: "Feature",
        geometry: { type: "Point", coordinates: [z.c[1], z.c[0]] },
        properties: { n: z.n, dao: z.dao, now: z.now || "", vols: String(z.vols[0]),
          xct: (z.xian || []).length,
          yz: z.yz || "", color: DAOCOLORS[(HY.daos.find(function (d) { return d.name === z.dao; }) || {}).id] || "#8b8069" } };
    });
    return { type: "FeatureCollection", features: feats };
  }

  /* 文柱卡：沿革句节引 + 文量/柱高依据 + ⟩ 入 2D 州卡（点击柱即此） */
  function openPillar(p) {
    var cx = document.getElementById("cx");
    document.getElementById("cn").textContent = p.n;
    document.getElementById("cm").textContent = p.dao + " · 今" + (p.now || "?") + " · 卷" + p.vols +
      " · 文柱 " + (p.h / 1000).toFixed(1) + " km（文量 " + p.yt + " 字 · log 示意尺度）";
    cx.textContent = (p.yz || "").slice(0, 240) + "……";
    cx.insertAdjacentHTML("beforeend",
      '<a class="go2d" href="index.html#mode=yutu&zhou=' + encodeURIComponent(p.n) + '">⟩ 入 2D 州卡</a>');
    document.getElementById("card").style.display = "block";
    if (p.lng != null) {
      map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 6.4), duration: 1.2 });
    }
  }

  /* 形胜视角（学方舆经纬「形胜视角」） */
  var VIEWS = [
    ["關中望中原", [109.0, 34.3], 5.6, 58, 100],
    ["洛陽伊闕", [112.5, 34.6], 6.2, 60, 20],
    ["劍門窺蜀", [105.5, 32.2], 6.6, 66, 160],
    ["太行井陘", [113.9, 38.05], 6.4, 62, 140],
    ["江陵望三峽", [112.4, 30.4], 6.0, 58, 250],
    ["嶺南五羊", [113.3, 23.1], 6.0, 55, 30],
  ];
  var host = document.getElementById("views");
  VIEWS.forEach(function (v, i) {
    var b = document.createElement("button");
    b.textContent = v[0];
    b.onclick = function () {
      stopFly();
      document.querySelectorAll("#views button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      map.flyTo({ center: v[1], zoom: v[2], pitch: v[3], bearing: v[4], duration: 2.6 });
    };
    host.appendChild(b);
  });

  /* 飛覽：六形勝連飛（P2-D） */
  var flyTimer = null, flyBtn = document.createElement("button");
  flyBtn.textContent = "▶ 飛覽";
  flyBtn.title = "自西而東連飛六處形勝，再點止";
  function stopFly() {
    if (flyTimer) { clearInterval(flyTimer); flyTimer = null; flyBtn.classList.remove("on"); flyBtn.textContent = "▶ 飛覽"; }
  }
  flyBtn.onclick = function () {
    if (flyTimer) { stopFly(); return; }
    flyBtn.classList.add("on"); flyBtn.textContent = "■ 止飛";
    document.querySelectorAll("#views button").forEach(function (x) { x.classList.remove("on"); });
    var i = 0;
    var step = function () {
      var v = VIEWS[i % VIEWS.length];
      document.querySelectorAll("#views button:not(.fly)").forEach(function (x) { x.classList.remove("on"); });
      if (host.children[i % VIEWS.length]) host.children[i % VIEWS.length].classList.add("on");
      map.flyTo({ center: v[1], zoom: v[2], pitch: v[3], bearing: v[4], duration: 4.2, essential: true });
      i++;
    };
    step();
    flyTimer = setInterval(step, 7000);
  };
  flyBtn.className = "fly";
  host.appendChild(flyBtn);

  /* 沿革文柱开关（默认立柱， ◧ 再点即收） */
  var pillBtn = document.createElement("button");
  pillBtn.className = "fly";
  pillBtn.textContent = "◧ 文柱 ✓";
  pillBtn.title = "沿革文柱：条目文量≥2500 字的大州立柱，柱高随文量（log 示意尺度），点击入 2D 州卡";
  var pillOn = true;
  pillBtn.onclick = function () {
    pillOn = !pillOn;
    map.setLayoutProperty("yz-pillar", "visibility", pillOn ? "visible" : "none");
    pillBtn.textContent = pillOn ? "◧ 文柱 ✓" : "◧ 文柱";
  };
  host.appendChild(pillBtn);

  /* 冒烟/调试钩（同主站 window.HYAPP 惯例；无头环境 style 或不载，数据与卡逻辑仍可验） */
  window.HY3D = { map: map, pillarGeo: pillarGeo, openPillar: openPillar,
                  pillarCount: function () {
    return map.getSource("pillars") ? map.getSource("pillars")._data.features.length : -1; } };
})();
</script>
</body>
</html>
